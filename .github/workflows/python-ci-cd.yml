
name: Research Risk Assessment CI/CD

on:
  push:
    branches:
      - main
      - dev
      - feature/windows-exe
      - feature/streamlit-web-app

    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:

  # CONTINUOUS INTEGRATION
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check Python Syntax
        run: |
          python -m compileall -q app.py gui.py streamlit_app.py test_app.py

      - name: Run Unit Tests
        run: python -m unittest discover -v

  # PACKAGE BOTH APPLICATIONS
  package:
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package Research Risk Assessment
        run: |
          zip research-risk-assessment.zip \
            app.py \
            gui.py \
            streamlit_app.py \
            requirements.txt

      - name: Upload Application
        uses: actions/upload-artifact@v4
        with:
          name: research-risk-assessment
          path: research-risk-assessment.zip

  # WINDOWS DESKTOP EXECUTABLE
  build-windows-exe:
    runs-on: windows-latest
    needs: test

    if: github.event_name == 'push' && (
      github.ref == 'refs/heads/feature/windows-exe' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
      )

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RiskAssessment gui.py

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: RiskAssessment-Windows
          path: dist/RiskAssessment.exe

  # AUTOMATED GITHUB RELEASE
  create-release:
    runs-on: ubuntu-latest
    needs:
      - test
      - build-windows-exe

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows Executable
        uses: actions/download-artifact@v4
        with:
          name: RiskAssessment-Windows
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Research Risk Assessment ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/RiskAssessment.exe
          fail_on_unmatched_files: true
