
name: Python GUI CI-CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - feature/windows-exe

    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - dev
permissions:
  contents: read
  
jobs:

  # CONTINUOUS INTEGRATION (CI)
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Unit Tests
        run: python -m unittest discover -v


  # CONTINUOUS DELIVERY & ZIP PACKAGE
  package:
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package GUI Application
        run: |
          zip risk-assessment-gui.zip app.py gui.py requirements.txt

      - name: Upload Application
        uses: actions/upload-artifact@v4
        with:
          name: risk-assessment-gui
          path: risk-assessment-gui.zip


  # WINDOWS EXECUTABLE BUILD
  build-windows-exe:
    runs-on: windows-latest
    needs: test

    if: github.event_name == 'push' && (
      github.ref == 'refs/heads/feature/windows-exe' ||
      github.ref == 'refs/heads/main'
      )

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RiskAssessment gui.py

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: RiskAssessment-Windows
          path: dist/RiskAssessment.exe

  # AUTOMATED GITHUB RELEASE
  create-release:
    runs-on: ubuntu-latest
    needs:
      - test
      - build-windows-exe

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows Executable
        uses: actions/download-artifact@v4
        with:
          name: RiskAssessment-Windows
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Risk Assessment App ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/RiskAssessment.exe
          fail_on_unmatched_files: true

